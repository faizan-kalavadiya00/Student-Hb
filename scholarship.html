        <h1 style="color:white; font-size:40px;">

        <p style="margin-left:auto;">

            <a href="home.html"

            <a href="dashboard.html"

    <!-- Main Box -->

    <div style="width:900px;
                margin:50px auto;
                background-color:#eeeeee;
                padding:30px;

        <div style="background-color:white;

        <table border="1"

                <td>2026-27</td>
