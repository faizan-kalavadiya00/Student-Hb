<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>

<body style="margin:0; font-family:Arial, Helvetica, sans-serif;">

    <!-- Header -->
    <div style="background-color:rgb(38,69,70); display:flex; align-items:center; padding:10px;">

        <img src="student.png"
             alt="Student Hub Logo"
             style="width:150px; height:120px; margin-right:30px;">

        <h1 style="color:white; font-size:40px;">
            Student Hub
        </h1>

        <p style="margin-left:auto;">

            <a href="home.html"
               style="text-decoration:none; color:lightslategray; margin-right:20px; font-size:20px;">
               Home
            </a>

            <a href="dashboard.html"
               style="text-decoration:none; color:lightslategray; margin-right:20px; font-size:20px;">
               Dashboard
            </a>

            <a href="profile.html"
               style="text-decoration:none; color:lightslategray; margin-right:20px; font-size:20px;">
               Profile
            </a>

            <a href="faq.html"
               style="text-decoration:none; color:lightslategray; margin-right:20px; font-size:20px;">
               FAQs
            </a>

            <a href="about.html"
               style="text-decoration:none; color:lightslategray; margin-right:20px; font-size:20px;">
               About
            </a>

        </p>

    </div>

    <!-- Login Heading -->

    <h1 style="text-align:center;
           color:rgb(38,69,70);
           font-size:50px;
           margin-top:70px;
           margin-bottom:40px;">
    Login to Student Hub
</h1>

   

    <div style="width:400px;
                margin:auto;
                background-color:#d9d9d9;
                padding:40px;">

        <form action="dashboard.html">

            <input type="text"
                   placeholder="Enter ID"
                   style="width:380px;
                          height:40px;
                          font-size:18px;
                          padding-left:10px;
                          margin-bottom:30px;">

            <br>

            <input type="password"
                   placeholder="Password"
                   style="width:380px;
                          height:40px;
                          font-size:18px;
                          padding-left:10px;">

            <br><br><br>

            <input type="submit"
                   value="Login"
                   style="width:395px;
                          height:45px;
                          background-color:rgb(38,69,70);
                          color:white;
                          border:none;
                          font-size:18px;
                          cursor:pointer;">

        </form>

    </div>

</body>
</html>
