<!DOCTYPE html>

<html>
<head>
    <title>Registration - Student Hub</title>
    <link href="style.css" rel="stylesheet">
<script src="script.js" defer></script></head>

<body class="external-style-21">

    <div class="external-style-22">

        <img
            alt="Student Hub Logo"
            class="external-style-23"
            src="student.png"
        >

        <h1 class="external-style-24">
            Student Hub
        </h1>

        <p class="external-style-25">
    <a class="external-style-6" href="home.html">Home</a>
    <a class="external-style-6" href="dashboard.html">Dashboard</a>

    </div>

    <h1 class="registration-title">
        Student Registration
    </h1>

    <form class="registration-form" action="dashboard.html">

        <div class="registration-field">
            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
            >
        </div>

        <div class="registration-field">
            <label for="enrollment">Enrollment Number</label>
            <input
                type="text"
                id="enrollment"
                name="enrollment"
                placeholder="Enter enrollment number"
            >
        </div>

        <div class="registration-field">
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
            >
        </div>

        <div class="registration-field">
            <label for="mobile">Mobile Number</label>
            <input
                type="tel"
                id="mobile"
                name="mobile"
                placeholder="Enter mobile number"
            >
        </div>

        <div class="registration-field">
            <label for="course">Course</label>

            <select id="course" name="course">

                <option value="">
                    Select Course
                </option>

                <option value="btech-cs">
                    B.Tech Computer Science
                </option>

                <option value="btech-it">
                    B.Tech Information Technology
                </option>

                <option value="btech-ce">
                    B.Tech Computer Engineering
                </option>

            </select>

        </div>

        <div class="registration-field">
            <label for="semester">Semester</label>

            <select id="semester" name="semester">

                <option value="">
                    Select Semester
                </option>

                <option value="1">
                    Semester 1
                </option>

                <option value="2">
                    Semester 2
                </option>

                <option value="3">
                    Semester 3
                </option>

                <option value="4">
                    Semester 4
                </option>

                <option value="5">
                    Semester 5
                </option>

                <option value="6">
                    Semester 6
                </option>

                <option value="7">
                    Semester 7
                </option>

                <option value="8">
                    Semester 8
                </option>

            </select>

        </div>

        <div class="registration-field">
            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
            >
        </div>

        <div class="registration-field">
            <label for="confirm-password">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirm-password"
                name="confirm-password"
                placeholder="Confirm password"
            >
        </div>

        <button type="submit" class="registration-button">
            Register
        </button>

    </form>

    <footer class="site-footer">

        <p>
            <b>Student Hub</b>
        </p>

        <p>
            © 2026 Student Hub. All Rights Reserved.
        </p>

    </footer>

</body>
</html>
